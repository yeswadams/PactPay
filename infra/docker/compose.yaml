
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pactpay
      POSTGRES_PASSWORD: pactpay_dev
      POSTGRES_DB: pactpay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactpay -d pactpay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
