services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pactpay
      POSTGRES_PASSWORD: pactpay_dev
      POSTGRES_DB: pactpay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactpay -d pactpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  objectstore:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: mini -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/s3.local.json
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - objectstore_data:/data
      - ./s3.local.json:/etc/seaweedfs/s3.local.json:ro

volumes:
  postgres_data:
  objectstore_data:
